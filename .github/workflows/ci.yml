name: CI-CD

on:
  push:
    branches: [main-vercel, main]
  pull_request:
    branches: [main-vercel, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assistant_chat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Enable Postgres storage only for the main branch (VPS)
          ENABLE_POSTGRES_STORAGE: ${{ github.ref == 'refs/heads/main' }}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: assistant_chat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          TEST_CONSTANT: 123
        run: |
          # Build server for testing
          npm run build:server
          # Start server in background
          node build/server.js &
          # Wait for server to start
          sleep 10
          # Run API tests
          npm test

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test-and-build, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_ENV_FILE
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.VPS_APP_PATH }}"
            REPO_URL="${{ secrets.VPS_REPO_URL }}"
            REPO_BRANCH="${{ secrets.VPS_REPO_BRANCH }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone --branch "$REPO_BRANCH" "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            git fetch origin "$REPO_BRANCH"
            git checkout "$REPO_BRANCH"
            git reset --hard "origin/$REPO_BRANCH"

            printf "%s" "$APP_ENV_FILE" > .env

            make docker-deploy
            make docker-prune

            echo "=== [HEALTH CHECK] Verifying Deployment ==="
            
            # 1. Check if App is reachable
            for i in {1..10}; do
              if curl -sf http://localhost:3000/api/logs > /dev/null; then
                echo "[OK] App is reachable."
                break
              fi
              echo "[WAIT] App not ready, retrying in 5s... ($i/10)"
              sleep 5
            done

            # 2. Check if Database is healthy (Only for VPS/Docker)
            echo "=== [DB CHECK] Verifying PostgreSQL ==="
            if make docker-check-db; then
              echo "[OK] Database is healthy."
            else
              echo "[FAIL] Database check failed!"
              exit 1
            fi
  
  deploy-vercel:

    name: Deploy to Vercel

    runs-on: ubuntu-latest

    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main-vercel'

    env:

      VERCEL_TELEMETRY_DISABLED: 1

      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

      - name: Pull Vercel Environment Information

        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts

        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel

        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}