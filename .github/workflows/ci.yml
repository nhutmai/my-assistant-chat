name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

        

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_ENV_FILE
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.VPS_APP_PATH }}"
            REPO_URL="${{ secrets.VPS_REPO_URL }}"
            REPO_BRANCH="${{ secrets.VPS_REPO_BRANCH }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone --branch "$REPO_BRANCH" "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            git fetch origin "$REPO_BRANCH"
            git checkout "$REPO_BRANCH"
            git reset --hard "origin/$REPO_BRANCH"

            printf "%s" "$APP_ENV_FILE" > .env

            make docker-deploy
            make docker-prune